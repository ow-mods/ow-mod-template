name: Publish Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [OuterWildsModTemplate.csproj]
    
jobs:
  Publish:
    name: Publish Package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        
      - name: Restore
        run: dotnet restore
        
      - name: Pack Template
        run: dotnet pack --no-build -c Release -o .

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      
      - name: Upload Package
        run: dotnet nuget push Bwc9876.OuterWildsModTemplate.*.nupkg -k ${{steps.login.outputs.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json --skip-duplicate
